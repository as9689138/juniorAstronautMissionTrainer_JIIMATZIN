<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1d1238">
<meta name="mobile-web-app-capable" content="yes">
<title>Misión P.I.E.D.R.A</title>
<link rel="icon" type="image/png" href="assets/portada/insignia.png">
<style>
  html, body { margin: 0; height: 100%; background: #120d0c; overflow: hidden; }
  /* En teléfonos con muesca (viewport-fit=cover) el juego queda dentro de la zona segura: nada bajo la muesca ni la barra de inicio */
  #juego { position: fixed; inset: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  /* El juego es horizontal: en un teléfono o tableta en vertical se pide girarlo */
  #girar { display: none; position: fixed; inset: 0; z-index: 100; background: #1d1238; color: #fff8ea;
    font: 600 19px/1.4 system-ui, sans-serif; text-align: center; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; }
  #girar img { width: 112px; height: 112px; }
  #girar .tel { width: 46px; height: 80px; border: 4px solid #ff9a3c; border-radius: 9px; animation: girar 2.2s ease-in-out infinite; }
  #girar small { font-weight: 400; opacity: .75; }
  @keyframes girar { 0%, 25% { transform: rotate(0); } 55%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) and (pointer: coarse) { #girar { display: flex; } }
</style>
</head>
<body>
<div id="juego"></div>
<div id="girar" role="alert"><img src="assets/portada/insignia.png" alt=""><div class="tel"></div><div>Gira tu teléfono para jugar<br><small>Rotate your phone to play</small></div></div>
<!-- Phaser 4.2.1 guardado en el repositorio: no depende de un CDN -->
<script src="lib/phaser.min.js"></script>
<!-- inkjs 2.2.3 (MIT): corre la historia de Ink (historia/historia.json) -->
<script src="lib/ink.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
